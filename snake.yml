name: Generate Purple Snake Contribution Graph

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate purple Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23A78BFA&color_dots=%230C0C0C,%234A3F6B,%23673DE6,%23A78BFA,%23C4B5FD
            dist/github-snake-dark.svg?color_snake=%23C4B5FD&color_dots=%230C0C0C,%234A3F6B,%23673DE6,%23A78BFA,%23C4B5FD&palette=github-dark

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
